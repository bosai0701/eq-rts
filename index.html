<body>

<script>
const WS_URL =
'wss://round-ira-creative-reservoir.trycloudflare.com/';

const NTP_URL =
'https://api.wolfx.jp/ntp.json';

const TIME_SYNC_INTERVAL = 60000;
const TIME_SYNC_SAMPLES = 5;
const RECONNECT_BASE = 1000;
const RECONNECT_MAX = 10000;
const PING_INTERVAL = 10000;
const HIDDEN_DISCONNECT = 60000;

const IMAGE_LAG_LIMIT = 3000;

const LAST_FRAME_CACHE_KEY = 'EQ_RTS_LAST_FRAME_V1';
const CACHE_SAVE_INTERVAL = 2000;

const INITIAL_CENTER = [138,36.5];
const INITIAL_ZOOM = 4.2;

const JAPAN_BOUNDS = [
 [122.5,24],
 [146,46]
];

const MAP_PADDING = {
 top:90,
 right:35,
 bottom:70,
 left:35
};

/* ========== 揺れ検知（Server側で計算。ここでは表示のみ） ========== */

/* Serverから一定時間 検知状態が届かない場合は古い表示を消す */
const SHAKE_STALE_MS = 8000;

/* 揺れの色分け基準 */
const SHAKE_COLOR_MIN_INTENSITY = -1.5;
const SHAKE_YELLOW_INTENSITY = 0.5;
const SHAKE_RED_INTENSITY = 2.5;

const SHAKE_COLOR_WEAK = '#16a34a';
const SHAKE_COLOR_MEDIUM = '#eab308';
const SHAKE_COLOR_STRONG = '#dc2626';

/* 自動ズーム */
const SHAKE_FOCUS_INTERVAL = 3000;
const SHAKE_USER_PAUSE = 15000;
const SHAKE_RETURN_DELAY = 2000;
const SHAKE_FOCUS_MAX_ZOOM = 7.5;
const SHAKE_FOCUS_MARGIN_DEG = 0.25;

/* イベント円 */
const SHAKE_CIRCLE_PAD = 8;
const SHAKE_CIRCLE_MIN = 12;

let clockBaseEpoch = null;
let clockBasePerf = null;
let clockSynced = false;
let timeSyncPromise = null;
let lastAppliedImageMs = null;
let stations = [];
let stationsSig = '';
let forceUpdate = true;
let firstFit = true;
let map;
let lastCacheSavePerf = -1e9;
let lastFrameCacheRestored = false;

let serverShake = null;
let shakeRecvPerf = -1e9;
let shakeEverReceived = false;

const $ = id => document.getElementById(id);

const HEX = Array.from(
 {length:256},
 (_,i)=>i.toString(16).padStart(2,'0')
);

const p2 = n=>String(n).padStart(2,'0');

function setText(el,text){
 if(el._t===text)return;
 el._t=text;
 el.textContent=text;
}

function getSyncedNow(){
 if(!clockSynced){
  return Date.now();
 }

 return clockBaseEpoch+
  (performance.now()-clockBasePerf);
}

function updateImageTimeColor(){
 const el=$('imgTime');

 if(lastAppliedImageMs===null){
  el.classList.remove('image-stale');
  return;
 }

 const lag=getSyncedNow()-lastAppliedImageMs;

 el.classList.toggle(
  'image-stale',
  lag>IMAGE_LAG_LIMIT
 );
}

/* ========== 最後の画像の保存・復元 ========== */

function saveLastFrameCache(force){
 if(
  lastAppliedImageMs===null||
  !stations.length
 ){
  return;
 }

 const now=performance.now();

 if(!force&&now-lastCacheSavePerf<CACHE_SAVE_INTERVAL){
  return;
 }

 lastCacheSavePerf=now;

 try{
  const points=[];

  for(const st of stations){
   if(!st.valid)continue;

   points.push([
    st.i,
    st.r,
    st.g,
    st.b
   ]);
  }

  localStorage.setItem(
   LAST_FRAME_CACHE_KEY,
   JSON.stringify({
    version:1,
    ms:lastAppliedImageMs,
    width:lastImageWidth,
    height:lastImageHeight,
    total:stations.length,
    points
   })
  );

 }catch(e){
  console.warn('最後の画像を保存できません:',e);
 }
}

function restoreLastFrameCache(){
 if(lastFrameCacheRestored)return false;
 if(!stations.length)return false;

 /* Serverのデータを受信済みなら復元しない */
 if(lastAppliedImageMs!==null)return false;

 lastFrameCacheRestored=true;

 try{
  const raw=localStorage.getItem(
   LAST_FRAME_CACHE_KEY
  );

  if(!raw)return false;

  const cache=JSON.parse(raw);

  if(
   !cache||
   cache.version!==1||
   !Number.isFinite(cache.ms)||
   !Array.isArray(cache.points)||
   cache.total!==stations.length
  ){
   return false;
  }

  for(const st of stations){
   st.valid=false;
  }

  for(const row of cache.points){
   if(!Array.isArray(row)||row.length<4)continue;

   const st=stations[Number(row[0])];

   if(!st)continue;

   const r=Number(row[1]);
   const g=Number(row[2]);
   const b=Number(row[3]);

   if(
    !Number.isInteger(r)||
    !Number.isInteger(g)||
    !Number.isInteger(b)||
    r<0||r>255||
    g<0||g>255||
    b<0||b>255
   ){
    continue;
   }

   st.r=r;
   st.g=g;
   st.b=b;
   st.hex='#'+HEX[r]+HEX[g]+HEX[b];
   st.valid=true;
  }

  updateStationSource();

  lastAppliedImageMs=cache.ms;

  setText(
   $('imgTime'),
   formatJST(cache.ms)
  );

  forceUpdate=false;

  updateImageTimeColor();

  console.log('最後の画像を復元しました',formatJST(cache.ms));

  return true;

 }catch(e){
  console.warn('最後の画像を復元できません:',e);
  return false;
 }
}

/* ========== 時刻 ========== */

function jstParts(ms){
 const d=new Date(ms+9*3600e3);

 return {
  Y:d.getUTCFullYear(),
  M:p2(d.getUTCMonth()+1),
  D:p2(d.getUTCDate()),
  h:p2(d.getUTCHours()),
  m:p2(d.getUTCMinutes()),
  s:p2(d.getUTCSeconds())
 };
}

function formatJST(ms){
 const t=jstParts(ms);

 return `${t.Y}/${t.M}/${t.D} ${t.h}:${t.m}:${t.s}`;
}

async function fetchWolfxTime(){
 const start=performance.now();

 const controller=new AbortController();

 const timeout=setTimeout(
  ()=>controller.abort(),
  8000
 );

 try{
  const response=await fetch(
   NTP_URL+'?_='+Date.now(),
   {
    cache:'no-store',
    signal:controller.signal
   }
  );

  if(!response.ok){
   throw new Error('Wolfx HTTP '+response.status);
  }

  const data=await response.json();
  const end=performance.now();

  let epoch=Number(data.timestamp);

  if(!Number.isFinite(epoch)||epoch<1000000000000){
   const value=data.JST?.int;

   if(value){
    const s=String(value);

    if(/^\d{14}$/.test(s)){
     const iso=
      `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T`+
      `${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}+09:00`;

     epoch=Date.parse(iso);
    }
   }
  }

  if(!Number.isFinite(epoch)){
   throw new Error('Wolfx時刻を解析できません');
  }

  return {
   epoch,
   perf:(start+end)/2,
   rtt:end-start
  };

 }finally{
  clearTimeout(timeout);
 }
}

async function syncClock(){
 if(timeSyncPromise){
  return timeSyncPromise;
 }

 timeSyncPromise=(async()=>{
  const samples=[];

  for(let i=0;i<TIME_SYNC_SAMPLES;i++){
   try{
    samples.push(await fetchWolfxTime());
   }catch(e){
    console.warn('Wolfx同期失敗:',e);
   }
  }

  if(!samples.length){
   throw new Error('Wolfx時刻を取得できません');
  }

  samples.sort((a,b)=>a.rtt-b.rtt);

  const best=samples[0];

  clockBaseEpoch=best.epoch;
  clockBasePerf=best.perf;
  clockSynced=true;

  updateImageTimeColor();

  console.log('Wolfx時刻同期完了',{
   RTT:Math.round(best.rtt),
   samples:samples.length,
   serverTime:new Date(best.epoch).toISOString()
  });

  return best;

 })().finally(()=>{
  timeSyncPromise=null;
 });

 return timeSyncPromise;
}

async function maintainClock(){
 try{
  await syncClock();
 }catch(e){
  console.error('時刻再同期エラー:',e);
 }

 setTimeout(maintainClock,TIME_SYNC_INTERVAL);
}

function tickSyncTime(){
 const now=getSyncedNow();

 setText($('syncTime'),formatJST(now));

 updateImageTimeColor();

 setTimeout(
  tickSyncTime,
  1000-(now%1000)+15
 );
}

/* ========== WebSocket ========== */

const wsStats={
 state:'未接続',
 connects:0,
 frames:0,
 errors:0,
 lastRecvPerf:null,
 clients:null
};

let ws=null;
let wsPing=null;
let wsReconnectTimer=null;
let wsAttempt=0;
let wsWanted=true;
let hiddenTimer=null;

function isWsOpen(){
 return !!ws&&ws.readyState===WebSocket.OPEN;
}

function updateWsInfo(){
 const el=$('wsInfo');

 const connected=isWsOpen();

 el.classList.toggle('connected',connected);

 const label=el.querySelector('span:last-child');

 setText(
  label,
  connected?'WSS 接続中':'WSS 未接続'
 );

 renderShake();
}

function scheduleReconnect(){
 if(!wsWanted)return;

 clearTimeout(wsReconnectTimer);

 const delay=Math.min(
  RECONNECT_BASE*2**wsAttempt,
  RECONNECT_MAX
 );

 wsAttempt++;

 wsReconnectTimer=setTimeout(connectStream,delay);
}

/* 観測点リストやフレームがServerと食い違った場合は接続し直して再同期する */
function resyncSocket(){
 if(!ws)return;

 try{
  ws.close();
 }catch(_){}
}

function handleTextMessage(text){
 let msg=null;

 try{
  msg=JSON.parse(text);
 }catch(_){
  return;
 }

 if(!msg||typeof msg!=='object')return;

 if(msg.type==='error'){
  wsStats.errors++;
  return;
 }

 if(msg.type==='stations'){
  handleStations(msg);
  return;
 }

 if(msg.type==='shake_state'){
  handleShakeState(msg);
 }
}

function connectStream(){
 if(!wsWanted)return;

 if(
  ws&&
  (ws.readyState===WebSocket.OPEN||
   ws.readyState===WebSocket.CONNECTING)
 ){
  return;
 }

 const s=new WebSocket(WS_URL);

 s.binaryType='arraybuffer';

 ws=s;

 updateWsInfo();

 s.onopen=()=>{
  if(ws!==s)return;

  wsAttempt=0;
  wsStats.connects++;
  wsStats.state='接続中';

  updateWsInfo();

  clearInterval(wsPing);

  wsPing=setInterval(()=>{
   try{
    if(s.readyState===WebSocket.OPEN){
     s.send('ping');
    }
   }catch(_){}
  },PING_INTERVAL);
 };

 s.onmessage=ev=>{
  if(ws!==s)return;

  wsStats.lastRecvPerf=performance.now();

  if(typeof ev.data==='string'){
   handleTextMessage(ev.data);
   return;
  }

  wsStats.frames++;

  try{
   applyFrame(ev.data);
  }catch(e){
   wsStats.errors++;
   console.error('フレーム処理エラー:',e);
  }
 };

 s.onerror=()=>{};

 s.onclose=()=>{
  if(ws===s){
   ws=null;
  }else{
   return;
  }

  clearInterval(wsPing);

  wsStats.state='切断';

  updateWsInfo();

  scheduleReconnect();
 };
}

/* ========== 観測点 ========== */

let lastImageWidth=0;
let lastImageHeight=0;

function handleStations(msg){
 if(!Array.isArray(msg.points)||!msg.points.length)return;

 let sum=0;

 for(const p of msg.points){
  sum+=p[0]*1.37+p[1]*2.11;
 }

 const sig=
  msg.points.length+':'+
  msg.w+'x'+msg.h+':'+
  sum.toFixed(4);

 /* 同じ観測点リストなら、表示中の状態を保持する */
 if(sig===stationsSig&&stations.length===msg.points.length){
  return;
 }

 stationsSig=sig;
 lastImageWidth=Number(msg.w)||0;
 lastImageHeight=Number(msg.h)||0;

 stations=msg.points.map((p,i)=>({
  i,

  geom:{
   type:'Point',
   coordinates:[p[0],p[1]]
  },

  lat:p[1],
  lon:p[0],

  r:0,
  g:0,
  b:0,

  hex:'#000000',
  valid:false
 }));

 setText(
  $('total'),
  stations.length.toLocaleString()
 );

 forceUpdate=true;

 /* 観測点リストが変わった場合、前回の保存画像は使えない */
 lastAppliedImageMs=null;
 lastFrameCacheRestored=false;

 updateStationSource();

 restoreLastFrameCache();
}

function updateStationSource(){
 const features=[];
 let shown=0;

 for(const st of stations){
  if(!st.valid)continue;

  shown++;

  features.push({
   type:'Feature',
   geometry:st.geom,
   properties:{
    i:st.i,
    hex:st.hex
   }
  });
 }

 setText(
  $('shown'),
  shown.toLocaleString()
 );

 if(!map)return;

 const source=map.getSource('stations');

 if(!source)return;

 source.setData({
  type:'FeatureCollection',
  features
 });
}

/*
 * フレーム処理。
 * 表示の保持（最後の有効値を数秒保持）や失効はServerが管理し、
 * valid=0 として届いた観測点だけを消す。
 */
function applyFrame(buf){
 if(!(buf instanceof ArrayBuffer))return;
 if(buf.byteLength<22)return;

 const dv=new DataView(buf);

 if(dv.getUint8(0)!==1)return;

 const ms=dv.getFloat64(1,true);
 const flags=dv.getUint8(13);
 const full=(flags&1)!==0;
 const total=dv.getUint16(14,true);
 const count=dv.getUint16(16,true);
 const clients=dv.getUint16(20,true);

 /*
  * 古い／重複した差分フレームは無視する。
  * 再接続時の全件スナップショットは同じ時刻でも必ず適用する。
  */
 if(
  lastAppliedImageMs!==null&&
  (ms<lastAppliedImageMs||(ms===lastAppliedImageMs&&!full))
 ){
  return;
 }

 if(buf.byteLength!==22+count*6){
  console.error(
   'フレーム長が不正です',
   buf.byteLength,
   count
  );

  return;
 }

 wsStats.clients=clients;

 if(!stations.length||stations.length!==total){
  console.warn(
   '観測点リストがServerと一致しません。再接続します',
   stations.length,
   total
  );

  resyncSocket();

  return;
 }

 setText(
  $('imageSize'),
  `${dv.getUint16(9,true)} × ${dv.getUint16(11,true)}px`
 );

 let changed=forceUpdate||full;

 if(full){
  for(const st of stations){
   st.valid=false;
  }
 }

 let o=22;

 for(let k=0;k<count;k++,o+=6){

  const st=stations[dv.getUint16(o,true)];

  if(!st)continue;

  changed=true;

  if(!dv.getUint8(o+2)){
   st.valid=false;
   continue;
  }

  const r=dv.getUint8(o+3);
  const g=dv.getUint8(o+4);
  const b=dv.getUint8(o+5);

  st.r=r;
  st.g=g;
  st.b=b;

  st.hex='#'+HEX[r]+HEX[g]+HEX[b];
  st.valid=true;
 }

 if(changed){
  updateStationSource();
  forceUpdate=false;
 }

 if(firstFit){
  let any=false;

  for(const st of stations){
   if(st.valid){
    any=true;
    break;
   }
  }

  if(any){
   firstFit=false;
   fitAll();
  }
 }

 setText(
  $('imgTime'),
  formatJST(ms)
 );

 lastAppliedImageMs=ms;

 updateImageTimeColor();

 saveLastFrameCache(false);
}

/* ========================================================================
 * 揺れ検知の表示
 * ====================================================================== */

const DEG2RAD=Math.PI/180;

function geoDistance(lat1,lon1,lat2,lon2){
 const dLat=(lat2-lat1)*DEG2RAD;
 const dLon=(lon2-lon1)*DEG2RAD;

 const a=
  Math.sin(dLat/2)**2+
  Math.cos(lat1*DEG2RAD)*
  Math.cos(lat2*DEG2RAD)*
  Math.sin(dLon/2)**2;

 return 6371*2*Math.asin(Math.min(1,Math.sqrt(a)));
}

function circlePolygon(lat,lon,radiusKm,props){
 const steps=48;
 const ring=[];

 const dLat=radiusKm/110.57;

 const dLon=
  radiusKm/(111.32*Math.max(0.1,Math.cos(lat*DEG2RAD)));

 for(let k=0;k<=steps;k++){
  const t=k/steps*Math.PI*2;

  ring.push([
   lon+dLon*Math.cos(t),
   lat+dLat*Math.sin(t)
  ]);
 }

 return {
  type:'Feature',
  geometry:{
   type:'Polygon',
   coordinates:[ring]
  },
  properties:props
 };
}

function shakeColor(intensity){
 if(
  intensity===null||
  intensity===undefined||
  !Number.isFinite(intensity)
 ){
  return SHAKE_COLOR_WEAK;
 }

 if(intensity<SHAKE_COLOR_MIN_INTENSITY){
  return SHAKE_COLOR_WEAK;
 }

 if(intensity>=SHAKE_RED_INTENSITY){
  return SHAKE_COLOR_STRONG;
 }

 if(intensity>=SHAKE_YELLOW_INTENSITY){
  return SHAKE_COLOR_MEDIUM;
 }

 return SHAKE_COLOR_WEAK;
}

function handleShakeState(msg){
 if(!Array.isArray(msg.events))return;

 serverShake=msg;
 shakeRecvPerf=performance.now();
 shakeEverReceived=true;

 renderShake();
}

/* Serverから検知状態が届かなくなったら古い表示を消す */
function checkShakeStale(){
 if(
  serverShake&&
  performance.now()-shakeRecvPerf>SHAKE_STALE_MS
 ){
  serverShake=null;
  renderShake();
 }
}

function renderShake(){
 const areas=[];
 const pts=[];
 const shownEvents=[];

 let confirmed=0;
 let pending=0;

 const events=serverShake?serverShake.events:[];

 for(const evt of events){

  const list=evt.pts;

  // 確定済みイベント以外は地図に表示しない
  if(evt.c!==1||!Array.isArray(list)||!list.length){
   continue;
  }

  const c=1;
  confirmed++;

  let sLat=0;
  let sLon=0;
  let maxIntensity=-Infinity;

  for(const p of list){

   sLon+=p[0];
   sLat+=p[1];

   pts.push({
    type:'Feature',
    geometry:{
     type:'Point',
     coordinates:[p[0],p[1]]
    },
    properties:{
     c,
     l:evt.l,
     hex:shakeColor(p[2])
    }
   });

   if(p[2]!==null&&p[2]>maxIntensity){
    maxIntensity=p[2];
   }
  }

  const n=list.length;
  const cLat=sLat/n;
  const cLon=sLon/n;

  let r=0;

  for(const p of list){
   const d=geoDistance(cLat,cLon,p[1],p[0]);

   if(d>r)r=d;
  }

  r+=SHAKE_CIRCLE_PAD;

  if(r<SHAKE_CIRCLE_MIN){
   r=SHAKE_CIRCLE_MIN;
  }

  areas.push(circlePolygon(
   cLat,
   cLon,
   r,
   {
    c,
    l:evt.l,
    hex:shakeColor(
     maxIntensity===-Infinity?null:maxIntensity
    )
   }
  ));

  if(c){
   shownEvents.push({
    id:evt.id,
    points:list.map(p=>({lat:p[1],lon:p[0]}))
   });
  }
 }

 if(map){

  const areaSrc=map.getSource('shake-areas');
  const ptSrc=map.getSource('shake-points');

  if(areaSrc){
   areaSrc.setData({
    type:'FeatureCollection',
    features:areas
   });
  }

  if(ptSrc){
   ptSrc.setData({
    type:'FeatureCollection',
    features:pts
   });
  }
 }

 updateShakeFocus(shownEvents);

 const el=$('shakeInfo');

 el.classList.toggle('confirmed',confirmed>0);
 el.classList.toggle(
  'pending',
  pending>0&&confirmed===0
 );

 const label=el.querySelector('span:last-child');

 if(!serverShake){

  if(!isWsOpen()){
   setText(label,'揺れ検知 サーバー未接続');

  }else if(shakeEverReceived){
   setText(label,'揺れ検知 更新停止');

  }else{
   setText(label,'揺れ検知 待機中');
  }

 }else if(!confirmed&&!pending){
  setText(label,'揺れ検知 なし');

 }else if(confirmed>0&&pending>0){
  setText(
   label,
   `揺れ検知 ${confirmed}件確定・${pending}件未確定`
  );

 }else if(confirmed>0){
  setText(
   label,
   `揺れ検知 ${confirmed}件（確定）`
  );

 }else{
  setText(
   label,
   `揺れ検知 ${pending}件（未確定）`
  );
 }
}

/* 揺れている範囲への自動ズーム */
let shakeFocusBounds=null;
let shakeFocusIds=new Set();
let shakeFocusPerf=-1e9;
let shakeFocused=false;
let shakeClearSince=null;
let userMovedPerf=-1e9;

function updateShakeFocus(evts){
 if(!map)return;

 const now=performance.now();

 if(!evts.length){

  shakeFocusIds=new Set();
  shakeFocusBounds=null;

  if(shakeFocused){

   if(shakeClearSince===null){
    shakeClearSince=now;

   }else if(now-shakeClearSince>=SHAKE_RETURN_DELAY){

    shakeFocused=false;
    shakeClearSince=null;

    if(now-userMovedPerf>=SHAKE_USER_PAUSE){
     fitAll();
    }
   }
  }

  return;
 }

 shakeClearSince=null;

 let minLat=90,maxLat=-90,minLon=180,maxLon=-180;
 let hasNew=false;

 const ids=new Set();

 for(const evt of evts){

  ids.add(evt.id);

  if(!shakeFocusIds.has(evt.id)){
   hasNew=true;
  }

  for(const p of evt.points){

   if(p.lat<minLat)minLat=p.lat;
   if(p.lat>maxLat)maxLat=p.lat;
   if(p.lon<minLon)minLon=p.lon;
   if(p.lon>maxLon)maxLon=p.lon;
  }
 }

 shakeFocusIds=ids;

 const b=shakeFocusBounds;

 const grew=
  !b||
  minLat<b.minLat-0.01||
  maxLat>b.maxLat+0.01||
  minLon<b.minLon-0.01||
  maxLon>b.maxLon+0.01;

 if(!hasNew&&!grew)return;

 if(
  !hasNew&&
  (
   now-userMovedPerf<SHAKE_USER_PAUSE||
   now-shakeFocusPerf<SHAKE_FOCUS_INTERVAL
  )
 ){
  return;
 }

 shakeFocusBounds={
  minLat,
  maxLat,
  minLon,
  maxLon
 };

 shakeFocusPerf=now;
 shakeFocused=true;

 const box=map.getContainer();
 const w=box.clientWidth;
 const h=box.clientHeight;

 const m=SHAKE_FOCUS_MARGIN_DEG;

 map.fitBounds(
  [
   [minLon-m,minLat-m],
   [maxLon+m,maxLat+m]
  ],
  {
   padding:{
    top:Math.min(170,h*0.35),
    bottom:Math.min(90,h*0.2),
    left:Math.min(50,w*0.1),
    right:Math.min(50,w*0.1)
   },
   maxZoom:SHAKE_FOCUS_MAX_ZOOM,
   bearing:0,
   pitch:0,
   duration:1200
  }
 );
}

/* ========== 地図 ========== */

function addSourceAndLayer(){
 if(!map.getSource('stations')){
  map.addSource('stations',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('station-points')){
  map.addLayer({
   id:'station-points',
   type:'circle',
   source:'stations',

   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,1.55,
     5,3.0,
     8,4.0,
     11,4.85
    ],

    'circle-color':['get','hex'],

    'circle-stroke-color':'#ffffff',
    'circle-stroke-width':0.25,

    'circle-opacity':1
   }
  });
 }

 if(!map.getSource('shake-areas')){
  map.addSource('shake-areas',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getSource('shake-points')){
  map.addSource('shake-points',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('shake-area-fill')){
  map.addLayer({
   id:'shake-area-fill',
   type:'fill',
   source:'shake-areas',
   paint:{
    'fill-color':['get','hex'],
    'fill-opacity':[
     'case',
     ['==',['get','c'],1],
     0.12,
     0.05
    ]
   }
  },'station-points');
 }

 if(!map.getLayer('shake-area-line-pending')){
  map.addLayer({
   id:'shake-area-line-pending',
   type:'line',
   source:'shake-areas',
   filter:['==',['get','c'],0],
   paint:{
    'line-color':['get','hex'],
    'line-width':1.6,
    'line-dasharray':[2,2]
   }
  },'station-points');
 }

 if(!map.getLayer('shake-area-line-confirmed')){
  map.addLayer({
   id:'shake-area-line-confirmed',
   type:'line',
   source:'shake-areas',
   filter:['==',['get','c'],1],
   paint:{
    'line-color':['get','hex'],
    'line-width':2.2
   }
  },'station-points');
 }

 if(!map.getLayer('shake-point-ring')){
  map.addLayer({
   id:'shake-point-ring',
   type:'circle',
   source:'shake-points',
   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,3.2,
     5,5.6,
     8,7.0,
     11,8.2
    ],
    'circle-color':'rgba(0,0,0,0)',
    'circle-stroke-color':['get','hex'],
    'circle-stroke-width':1.4,
    'circle-opacity':1
   }
  });
 }

 /* 地図の準備前に届いていた観測点・検知状態を反映 */
 updateStationSource();
 renderShake();
}

function fitAll(){
 if(!map)return;

 const bounds=new maplibregl.LngLatBounds();

 let hasValidPoint=false;

 for(const st of stations){

  if(
   !st.geom||
   !Array.isArray(st.geom.coordinates)
  ){
   continue;
  }

  const [lon,lat]=st.geom.coordinates;

  if(
   !Number.isFinite(lon)||
   !Number.isFinite(lat)
  ){
   continue;
  }

  bounds.extend([lon,lat]);
  hasValidPoint=true;
 }

 const options={
  padding:MAP_PADDING,
  maxZoom:5.2,
  bearing:0,
  pitch:0,
  duration:700
 };

 if(hasValidPoint){
  map.fitBounds(bounds,options);
 }else{
  map.fitBounds(JAPAN_BOUNDS,options);
 }
}

$('resetMapButton').addEventListener('click',()=>{
 userMovedPerf=performance.now();
 fitAll();
});

map=new maplibregl.Map({
 container:'map',

 style:'https://tiles.openfreemap.org/styles/positron',

 center:INITIAL_CENTER,
 zoom:INITIAL_ZOOM,
 bearing:0,
 pitch:0,

 attributionControl:{
  customAttribution:
   '<a href="https://www.kyoshin.bosai.go.jp/ja/about_kmoni/" target="_blank" rel="noopener noreferrer">防災科学技術研究所（NIED）</a>'
 }
});

map.on('error',e=>{
 console.error('MapLibre:',e.error||e);
});

/* 手動操作を検知 */
for(const t of [
 'dragstart',
 'zoomstart',
 'rotatestart',
 'pitchstart'
]){
 map.on(t,e=>{
  if(e&&e.originalEvent){
   userMovedPerf=performance.now();
  }
 });
}

document.addEventListener(
 'visibilitychange',
 ()=>{
  if(document.hidden){

   clearTimeout(hiddenTimer);

   hiddenTimer=setTimeout(()=>{
    wsWanted=false;

    clearTimeout(wsReconnectTimer);

    if(ws){
     try{
      ws.close(1000,'hidden');
     }catch(_){}
    }
   },HIDDEN_DISCONNECT);

  }else{

   clearTimeout(hiddenTimer);

   wsWanted=true;

   connectStream();
  }
 }
);

window.addEventListener(
 'pageshow',
 ()=>{
  wsWanted=true;
  connectStream();
 }
);

window.addEventListener(
 'pagehide',
 ()=>{
  saveLastFrameCache(true);
 }
);

map.on('load',()=>{
 addSourceAndLayer();

 fitAll();

 maintainClock();

 tickSyncTime();

 setInterval(checkShakeStale,1000);

 connectStream();
});
</script>
