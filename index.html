<script>
const WS_URL =
'wss://inquiries-saver-soap-swim.trycloudflare.com/';

const NTP_URL =
'https://api.wolfx.jp/ntp.json';

const POINTS_URL =
'https://raw.githubusercontent.com/ingen084/kyoshin-monitor-observation-points/refs/heads/master/intensity-points.json';

const TIME_SYNC_INTERVAL = 60000;
const TIME_SYNC_SAMPLES = 5;
const POINTS_TIMEOUT = 8000;
const RECONNECT_BASE = 1000;
const RECONNECT_MAX = 10000;
const PING_INTERVAL = 10000;
const HIDDEN_DISCONNECT = 60000;

const INITIAL_CENTER = [138,36.5];
const INITIAL_ZOOM = 4.2;

const JAPAN_BOUNDS = [
 [122.5,24],
 [146,46]
];

const MAP_PADDING = {
 top:90,
 right:35,
 bottom:70,
 left:35
};

let clockBaseEpoch = null;
let clockBasePerf = null;
let clockSynced = false;
let timeSyncPromise = null;
let lastAppliedImageMs = null;
let records = null;
let recordsPromise = null;
let preparedPoints = null;
let stations = [];
let forceUpdate = true;
let firstFit = true;
let map;
let lastImageWidth = 0;
let lastImageHeight = 0;
let lastImageCompletedPerf = null;

const $ = id => document.getElementById(id);

const HEX = Array.from(
 {length:256},
 (_,i)=>i.toString(16).padStart(2,'0')
);

const p2 = n=>String(n).padStart(2,'0');

function setText(el,text){
 if(el._t===text)return;
 el._t=text;
 el.textContent=text;
}

function getSyncedNow(){
 if(!clockSynced){
  return Date.now();
 }

 return clockBaseEpoch+
  (performance.now()-clockBasePerf);
}

function jstParts(ms){
 const d=new Date(ms+9*3600e3);

 return {
  Y:d.getUTCFullYear(),
  M:p2(d.getUTCMonth()+1),
  D:p2(d.getUTCDate()),
  h:p2(d.getUTCHours()),
  m:p2(d.getUTCMinutes()),
  s:p2(d.getUTCSeconds())
 };
}

function formatJST(ms){
 const t=jstParts(ms);

 return `${t.Y}/${t.M}/${t.D} ${t.h}:${t.m}:${t.s}`;
}

async function fetchWolfxTime(){
 const start=performance.now();

 const controller=new AbortController();

 const timeout=setTimeout(
  ()=>controller.abort(),
  8000
 );

 try{
  const response=await fetch(
   NTP_URL+'?_='+Date.now(),
   {
    cache:'no-store',
    signal:controller.signal
   }
  );

  if(!response.ok){
   throw new Error('Wolfx HTTP '+response.status);
  }

  const data=await response.json();
  const end=performance.now();

  let epoch=Number(data.timestamp);

  if(!Number.isFinite(epoch)||epoch<1000000000000){
   const value=data.JST?.int;

   if(value){
    const s=String(value);

    if(/^\d{14}$/.test(s)){
     const iso=
      `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T`+
      `${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}+09:00`;

     epoch=Date.parse(iso);
    }
   }
  }

  if(!Number.isFinite(epoch)){
   throw new Error('Wolfx時刻を解析できません');
  }

  return {
   epoch,
   perf:(start+end)/2,
   rtt:end-start
  };

 }finally{
  clearTimeout(timeout);
 }
}

async function syncClock(){
 if(timeSyncPromise){
  return timeSyncPromise;
 }

 timeSyncPromise=(async()=>{
  const samples=[];

  for(let i=0;i<TIME_SYNC_SAMPLES;i++){
   try{
    samples.push(await fetchWolfxTime());
   }catch(e){
    console.warn('Wolfx同期失敗:',e);
   }
  }

  if(!samples.length){
   throw new Error('Wolfx時刻を取得できません');
  }

  samples.sort((a,b)=>a.rtt-b.rtt);

  const best=samples[0];

  clockBaseEpoch=best.epoch;
  clockBasePerf=best.perf;
  clockSynced=true;

  console.log('Wolfx時刻同期完了',{
   RTT:Math.round(best.rtt),
   samples:samples.length,
   serverTime:new Date(best.epoch).toISOString()
  });

  return best;

 })().finally(()=>{
  timeSyncPromise=null;
 });

 return timeSyncPromise;
}

async function maintainClock(){
 try{
  await syncClock();
 }catch(e){
  console.error('時刻再同期エラー:',e);
 }

 setTimeout(maintainClock,TIME_SYNC_INTERVAL);
}

function tickSyncTime(){
 const now=getSyncedNow();

 setText($('syncTime'),formatJST(now));

 setTimeout(
  tickSyncTime,
  1000-(now%1000)+15
 );
}

const wsStats={
 state:'未接続',
 connects:0,
 frames:0,
 errors:0,
 lastRecvPerf:null,
 clients:null
};

function updateWsInfo(){
 const el=$('wsInfo');

 const connected=
  ws&&ws.readyState===WebSocket.OPEN;

 el.classList.toggle('connected',!!connected);

 const label=el.querySelector('span:last-child');

 setText(
  label,
  connected?'WSS 接続中':'WSS 未接続'
 );
}

let ws=null;
let wsPing=null;
let wsReconnectTimer=null;
let wsAttempt=0;
let wsWanted=true;
let hiddenTimer=null;

function scheduleReconnect(){
 if(!wsWanted)return;

 clearTimeout(wsReconnectTimer);

 const delay=Math.min(
  RECONNECT_BASE*2**wsAttempt,
  RECONNECT_MAX
 );

 wsAttempt++;

 wsReconnectTimer=setTimeout(connectStream,delay);
}

function handleTextMessage(text){
 let msg=null;

 try{
  msg=JSON.parse(text);
 }catch(_){
  return;
 }

 if(msg&&msg.type==='error'){
  wsStats.errors++;
 }
}

function connectStream(){
 if(!wsWanted)return;

 if(
  ws&&
  (ws.readyState===WebSocket.OPEN||
   ws.readyState===WebSocket.CONNECTING)
 ){
  return;
 }

 updateWsInfo();

 const s=new WebSocket(WS_URL);

 s.binaryType='arraybuffer';

 ws=s;

 s.onopen=()=>{
  wsAttempt=0;
  wsStats.connects++;
  wsStats.state='接続中';

  updateWsInfo();

  clearInterval(wsPing);

  wsPing=setInterval(()=>{
   try{
    if(s.readyState===WebSocket.OPEN){
     s.send('ping');
    }
   }catch(_){}
  },PING_INTERVAL);

  loadPoints().catch(()=>{});
 };

 s.onmessage=ev=>{
  if(typeof ev.data==='string'){
   handleTextMessage(ev.data);
   return;
  }

  wsStats.frames++;

  wsStats.lastRecvPerf=performance.now();

  const buf=ev.data;

  loadPoints()
   .then(()=>{
    if(ws===s){
     applyFrame(buf);
    }
   })
   .catch(e=>{
    wsStats.errors++;

    try{
     s.close();
    }catch(_){}
   });
 };

 s.onerror=()=>{};

 s.onclose=()=>{
  if(ws===s){
   ws=null;
  }

  clearInterval(wsPing);

  wsStats.state='切断';

  updateWsInfo();

  scheduleReconnect();
 };
}

function rgbToHSV(r,g,b){
 r/=255;
 g/=255;
 b/=255;

 const max=Math.max(r,g,b);
 const min=Math.min(r,g,b);
 const delta=max-min;

 let h=0;

 const v=max;
 const s=max===0?0:delta/max;

 if(delta!==0){
  if(max===r){
   h=(g-b)/delta;

   if(g<b){
    h+=6;
   }

  }else if(max===g){
   h=(b-r)/delta+2;

  }else{
   h=(r-g)/delta+4;
  }

  h/=6;
 }

 return {h,s,v};
}

function colorToPosition(hsv){
 const h=hsv.h;
 const s=hsv.s;
 const v=hsv.v;

 if(!(v>0.1&&s>0.75)){
  return null;
 }

 let p=0;

 if(h>0.1476){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;
  const h5=h4*h;
  const h6=h5*h;

  p=
   280.31*h6
   -916.05*h5
   +1142.6*h4
   -709.95*h3
   +234.65*h2
   -40.27*h
   +3.2217;

 }else if(h>0.001){
  const h2=h*h;
  const h3=h2*h;
  const h4=h3*h;

  p=
   151.4*h4
   -49.32*h3
   +6.753*h2
   -2.481*h
   +0.9033;

 }else{
  p=
   -0.005171*v*v
   -0.3282*v
   +1.2236;
 }

 if(p<0){
  p=0;
 }

 if(!Number.isFinite(p)){
  return null;
 }

 return p;
}

function walkRecords(value,out=[]){
 if(Array.isArray(value)){
  for(const v of value){
   walkRecords(v,out);
  }

  return out;
 }

 if(value&&typeof value==='object'){
  if(
   value.location&&
   value.point&&
   value.point.center_point
  ){
   out.push(value);
  }

  for(const v of Object.values(value)){
   if(v&&typeof v==='object'){
    walkRecords(v,out);
   }
  }
 }

 return out;
}

function preparePoints(recs){
 const result=[];

 for(const item of recs){
  const loc=item.location||{};
  const point=item.point||{};
  const center=point.center_point||{};
  const offset=point.offset||{};

  const lat=Number(loc.latitude);
  const lon=Number(loc.longitude);

  const x=
   Number(center.x)+Number(offset.x||0);

  const y=
   Number(center.y)+Number(offset.y||0);

  if(
   !Number.isFinite(lat)||
   !Number.isFinite(lon)||
   !Number.isFinite(x)||
   !Number.isFinite(y)
  ){
   continue;
  }

  if(item.is_suspended===true)continue;

  result.push({
   lat,
   lon,
   x:Math.round(x),
   y:Math.round(y),

   name:
    item.name||
    item.point_name||
    item.station_name||
    item.code||
    '観測点',

   region:
    item.region||
    item.prefecture||
    '',

   code:item.code||''
  });
 }

 return result;
}

function loadPoints(){
 if(recordsPromise){
  return recordsPromise;
 }

 recordsPromise=(async()=>{
  const controller=new AbortController();

  const timeout=setTimeout(
   ()=>controller.abort(),
   POINTS_TIMEOUT
  );

  try{
   const response=await fetch(
    POINTS_URL,
    {
     cache:'force-cache',
     signal:controller.signal
    }
   );

   if(!response.ok){
    throw new Error('観測点JSON HTTP '+response.status);
   }

   const raw=await response.text();

   const data=JSON.parse(raw.replace(/^\uFEFF/,''));

   records=walkRecords(data);

   if(!records.length){
    throw new Error('観測点データが見つかりません');
   }

   preparedPoints=preparePoints(records);

   if(!preparedPoints.length){
    throw new Error('有効な観測点がありません');
   }

   setText(
    $('total'),
    records.length.toLocaleString()
   );

   console.log('観測点準備完了',{
    total:records.length,
    prepared:preparedPoints.length
   });

   return preparedPoints;

  }finally{
   clearTimeout(timeout);
  }

 })().catch(e=>{
  recordsPromise=null;
  records=null;
  preparedPoints=null;
  throw e;
 });

 return recordsPromise;
}

function prepareStations(width,height){
 if(
  stations.length&&
  lastImageWidth===width&&
  lastImageHeight===height
 ){
  return;
 }

 lastImageWidth=width;
 lastImageHeight=height;

 stations=preparedPoints
  .filter(p=>
   p.x>=0&&
   p.y>=0&&
   p.x<width&&
   p.y<height
  )
  .map((p,i)=>({
   i,

   geom:{
    type:'Point',
    coordinates:[p.lon,p.lat]
   },

   name:p.name,
   region:p.region,
   code:p.code,

   x:p.x,
   y:p.y,

   r:0,
   g:0,
   b:0,

   hex:'#000000',
   position:null,
   valid:false
  }));

 forceUpdate=true;
}

function applyFrame(buf){
 const started=performance.now();

 if(buf.byteLength<22)return;

 const dv=new DataView(buf);

 if(dv.getUint8(0)!==1)return;

 const ms=dv.getFloat64(1,true);

 if(
  lastAppliedImageMs!==null&&
  ms<=lastAppliedImageMs
 ){
  return;
 }

 const w=dv.getUint16(9,true);
 const h=dv.getUint16(11,true);
 const flags=dv.getUint8(13);
 const total=dv.getUint16(14,true);
 const count=dv.getUint16(16,true);
 const serverMs=dv.getUint16(18,true);
 const clients=dv.getUint16(20,true);

 if(buf.byteLength!==22+count*6){
  console.error('フレーム長が不正です',buf.byteLength,count);
  return;
 }

 wsStats.clients=clients;

 prepareStations(w,h);

 if(stations.length!==total){
  console.error(
   '観測点数がサーバーと一致しません',
   total,
   stations.length
  );
  return;
 }

 setText($('imageSize'),`${w} × ${h}px`);

 let changed=forceUpdate;

 if(flags&1){
  for(const st of stations){
   st.valid=false;
   st.position=null;
  }

  changed=true;
 }

 let o=22;

 for(let k=0;k<count;k++,o+=6){
  const i=dv.getUint16(o,true);
  const st=stations[i];

  if(!st)continue;

  changed=true;

  if(!dv.getUint8(o+2)){
   st.valid=false;
   st.position=null;
   continue;
  }

  const r=dv.getUint8(o+3);
  const g=dv.getUint8(o+4);
  const b=dv.getUint8(o+5);

  st.r=r;
  st.g=g;
  st.b=b;

  const position=colorToPosition(
   rgbToHSV(r,g,b)
  );

  if(position===null){
   st.valid=false;
   st.position=null;
   continue;
  }

  st.hex='#'+HEX[r]+HEX[g]+HEX[b];
  st.position=position;
  st.valid=true;
 }

 let shown=0;

 for(const st of stations){
  if(st.valid)shown++;
 }

 setText(
  $('shown'),
  shown.toLocaleString()
 );

 if(changed&&map){
  const source=map.getSource('stations');

  if(source){
   const features=[];

   for(const st of stations){
    if(!st.valid)continue;

    features.push({
     type:'Feature',

     geometry:st.geom,

     properties:{
      i:st.i,
      hex:st.hex
     }
    });
   }

   source.setData({
    type:'FeatureCollection',
    features
   });

   forceUpdate=false;
  }
 }

 if(firstFit&&shown){
  firstFit=false;
  fitAll();
 }

 setText($('imgTime'),formatJST(ms));

 lastAppliedImageMs=ms;

 lastImageCompletedPerf=performance.now();
}

function addSourceAndLayer(){
 if(!map.getSource('stations')){
  map.addSource('stations',{
   type:'geojson',
   data:{
    type:'FeatureCollection',
    features:[]
   }
  });
 }

 if(!map.getLayer('station-points')){
  map.addLayer({
   id:'station-points',
   type:'circle',
   source:'stations',

   paint:{
    'circle-radius':[
     'interpolate',
     ['linear'],
     ['zoom'],
     2,1.5,
     5,2.9,
     8,3.8,
     11,4.7
    ],

    'circle-color':['get','hex'],

    'circle-stroke-color':'#ffffff',
    'circle-stroke-width':0.35,

    'circle-opacity':1
   }
  });
 }
}

function fitAll(){
 if(!map)return;

 const bounds=new maplibregl.LngLatBounds();

 let hasValidPoint=false;

 for(const st of stations){
  if(
   !st.geom||
   !Array.isArray(st.geom.coordinates)
  ){
   continue;
  }

  const [lon,lat]=st.geom.coordinates;

  if(
   !Number.isFinite(lon)||
   !Number.isFinite(lat)
  ){
   continue;
  }

  bounds.extend([lon,lat]);
  hasValidPoint=true;
 }

 const options={
  padding:MAP_PADDING,
  maxZoom:5.2,
  bearing:0,
  pitch:0,
  duration:700
 };

 if(hasValidPoint){
  map.fitBounds(bounds,options);
 }else{
  map.fitBounds(JAPAN_BOUNDS,options);
 }
}

$('resetMapButton').addEventListener('click',()=>{
 fitAll();
});

map=new maplibregl.Map({
 container:'map',

 style:'https://tiles.openfreemap.org/styles/positron',

 center:INITIAL_CENTER,
 zoom:INITIAL_ZOOM,
 bearing:0,
 pitch:0,

 attributionControl:{
  customAttribution:
   '<a href="https://www.kyoshin.bosai.go.jp/ja/about_kmoni/" target="_blank" rel="noopener noreferrer">防災科学技術研究所（NIED）</a>'
 }
});

map.on('error',e=>{
 console.error('MapLibre:',e.error||e);
});

document.addEventListener(
 'visibilitychange',
 ()=>{
  if(document.hidden){
   clearTimeout(hiddenTimer);

   hiddenTimer=setTimeout(()=>{
    wsWanted=false;

    clearTimeout(wsReconnectTimer);

    if(ws){
     try{
      ws.close(1000,'hidden');
     }catch(_){}
    }
   },HIDDEN_DISCONNECT);

  }else{
   clearTimeout(hiddenTimer);

   wsWanted=true;

   connectStream();
  }
 }
);

window.addEventListener(
 'pageshow',
 ()=>{
  wsWanted=true;
  connectStream();
 }
);

map.on('load',()=>{
 addSourceAndLayer();

 fitAll();

 maintainClock();

 tickSyncTime();

 connectStream();
});
</script>
